name: checks
on:
  push:
  pull_request:
jobs:
  page-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i -g playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Page checker self-test
        run: NODE_PATH=$(npm root -g) node skills/design-kit/scripts/test-check-page.mjs
      - name: Chart checker self-test
        run: NODE_PATH=$(npm root -g) node skills/chart/scripts/test-checks.mjs
      - name: Eval files are valid JSON
        run: for f in skills/*/evals/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
