<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Room</title>
<style>:root{--ink:#1D2B36;--paper:#F7F8F6}body{margin:0;padding:24px 16px;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
.muted{color:color-mix(in srgb,var(--ink) 75%,var(--paper))}.ok{color:oklch(0.35 0.08 160)}.dark{background:color-mix(in oklab,var(--ink) 90%,black);color:color-mix(in srgb,var(--paper) 92%,var(--ink));padding:12px}</style></head>
<body><h1>Reading room</h1><p class="muted">Members have read 170 of 245 pages on average.</p><p class="ok">On pace for the meeting on Thursday.</p><p class="dark">Next meeting: Thursday 3 December at the library.</p></body></html>
