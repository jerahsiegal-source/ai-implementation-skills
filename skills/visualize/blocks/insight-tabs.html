<!doctype html>
<html lang="en" data-proto><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Insight Tabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="family.css">
<style>
/* Insight Tabs: verdict, a row of insights, and each insight as claim beside its evidence. */
.page{display:flex;flex-direction:column;gap:28px}
.lede{font-size:20px;max-width:60ch;color:var(--muted)}
.study{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.study{grid-template-columns:1fr}}
.tabs{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line)}
@media (max-width:820px){.tabs{flex-direction:row;overflow-x:auto;border-left:0;border-bottom:2px solid var(--line);scrollbar-width:none}}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:28px 1fr;gap:4px;align-items:baseline;margin-left:-2px;border-left:3px solid transparent}
@media (max-width:820px){.tab{white-space:nowrap;margin:0 0 -2px;border-left:0;border-bottom:3px solid transparent}}
.tab small{font-family:var(--d);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab b{font-size:16px;line-height:1.3}
.tab:hover b{color:var(--accent)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab[aria-selected="true"] small{color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
@media (max-width:1000px){.panel{grid-template-columns:1fr;padding:20px}}
.panel.solo{grid-template-columns:1fr}
.claim{display:flex;flex-direction:column;gap:14px}
.claim h2{font-size:26px}
.claim p{font-size:18px}
.use{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:16px}
.use .ic{color:var(--accent);margin-top:4px}
.ev{display:flex;flex-direction:column;gap:10px;min-width:0}
.ev figure{margin:0;border:1px solid var(--line);border-radius:calc(var(--radius) - 4px);overflow:hidden;background:var(--sunk)}
.ev img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top center}
.ev figcaption{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.mock{padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.mock .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mock .row div{border-top:1px solid var(--line);padding-top:8px}
.mock .num{font-size:24px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 24px;font-size:15px}
.refs a{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.refs a:hover span:first-child{color:var(--accent)}
.refs a span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
.keys{font-size:14px;color:var(--muted)}
kbd{font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
</style></head><body>
<div class="wrapper"><div class="page" id="pg"></div></div>
<script src="data.js"></script><script src="ui.js"></script><script src="family.js"></script>
<script>
const R=[["Our World in Data","captured"],["Linear project updates","read"],["Tufte CSS","captured"],["Ink & Switch","captured"],["The Pudding","captured"],["Raycast changelog","captured"],["FT Visual Vocabulary","captured"],["GitHub Actions","from memory"],["Status pages","from memory"],["Things 3","from memory"],["Apple keynotes","from memory"],["NYT Upshot","from memory"]];
const urls=["https://ourworldindata.org/","https://linear.app/changelog/2023-08-16-project-progress-reports","https://edwardtufte.github.io/tufte-css/","https://www.inkandswitch.com/local-first/","https://pudding.cool/","https://www.raycast.com/changelog","https://ft-interactive.github.io/visual-vocabulary/","https://docs.github.com/actions","https://www.atlassianstatus.com/","https://culturedcode.com/things/","https://www.apple.com/apple-events/","https://www.nytimes.com/section/upshot"];
let cur=0;
const pg=document.getElementById("pg");
pg.innerHTML=`<header style="display:flex;flex-direction:column;gap:12px"><span class="kicker">Research · 12 references</span>
<h1>What great reports do</h1>
<p class="say">Answer first, show change, keep proof close.</p></header>
<div class="study"><div class="tabs" role="tablist" aria-label="Insights">${P.insights.map((x,i)=>`<button class="tab" role="tab" id="t${i}" aria-controls="panel" aria-selected="${i===0}" tabindex="${i===0?0:-1}"><small>${i+1}</small><b>${x.k}</b></button>`).join("")}</div>
<section class="panel" id="panel" role="tabpanel"></section></div>

<section class="need">${UI.icon("risk",20)}<div><b>Needs you</b>${P.need}</div><a href="decision-desk.html">Decide →</a></section>
<section style="display:flex;flex-direction:column;gap:10px"><h3>All 12 references</h3><div class="refs">${R.map((r,i)=>`<a href="${urls[i]}" target="_blank" rel="noopener"><span>${r[0]} ↗</span><span>${r[1]}</span></a>`).join("")}</div></section>`;
function show(i){cur=i;const x=P.insights[i];
 document.querySelectorAll(".tab").forEach((t,j)=>{t.setAttribute("aria-selected",j===i);t.tabIndex=j===i?0:-1});
 document.getElementById("panel").setAttribute("aria-labelledby","t"+i);
 const ev=!x.img&&!x.mock?"":x.img?`<figure><img src="${x.img}" alt="Screenshot of ${x.src}"></figure>`:`<figure><div class="mock"><div style="display:flex;gap:10px;align-items:center"><span class="pill on">${UI.icon("on")}On track</span><span class="kicker">Project update</span></div><p style="font-size:16px">Shipped the importer. Two milestones left; target date unchanged.</p><div class="row"><div><span class="num">+14</span><br><small>issues done</small></div><div><span class="num">2</span><br><small>milestones left</small></div><div><span class="num">0</span><br><small>date changes</small></div></div></div></figure>`;
 document.getElementById("panel").classList.toggle("solo",!ev);document.getElementById("panel").innerHTML=`<div class="claim"><h2>${x.k}</h2><p>${x.claim}</p><div class="use">${UI.icon("next",18)}<div><b>In Visualize:</b> ${x.use}</div></div></div>
 ${ev?`<div class="ev">${ev}<figcaption><span>${x.img?"Screenshot":"Redrawn sketch"}</span><a class="src" href="${x.url}" target="_blank" rel="noopener">${UI.icon("src",12)}${x.src}</a></figcaption></div>`:`<span><a class="src" href="${x.url}" target="_blank" rel="noopener">${UI.icon("src",12)}${x.src}</a></span>`}`;}
document.querySelectorAll(".tab").forEach((t,i)=>{t.onclick=()=>show(i);t.onkeydown=e=>{if(["ArrowRight","ArrowLeft","ArrowDown","ArrowUp"].includes(e.key)){const n=(cur+((e.key==="ArrowRight"||e.key==="ArrowDown")?1:4))%5;show(n);document.getElementById("t"+n).focus()}}});
show(0);
</script>
</body></html>
