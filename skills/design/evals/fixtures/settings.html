<!doctype html><html><head><meta charset="utf-8"><title>Settings</title></head><body>
<h1>Settings</h1>
<form>
<h2>Profile</h2>
<label for="name">Name</label><input id="name" value="Sam Rivera">
<label for="email">Email</label><input id="email" type="email" value="sam@example.com">
<h2>Notifications</h2>
<label><input type="checkbox" id="n-email" checked> Email me when a report is ready</label>
<label><input type="checkbox" id="n-weekly"> Weekly summary</label>
<h2>Danger zone</h2>
<button type="button" id="delete">Delete account</button>
<button type="submit" id="save">Save</button>
</form></body></html>
