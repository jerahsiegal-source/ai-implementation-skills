<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corner Cafe Sales</title>
<!-- The cream and terracotta palette is the brand in DESIGN.md, so that slop check is allowed on purpose. -->
<meta name="slop-ok" content="cream-terracotta">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Work+Sans:wght@400;600&display=swap">
<style>
/* Dashboard example built with /chart from evals/fixtures (example data).
   Brand from DESIGN.md. Its chart palette failed check-palette (#8C6A2E blurs with #B5482A for
   red-green color blindness), so the brand accent stays as the highlight and gray carries context. */
:root{
  --bg:#FBF7F2; --ink:#2A1E17; --muted:#6A5A4F; --grid:#E9E1D7; --axis:#B3A496;
  --hi:#B5482A; --s2:#2F6E73; --quiet:#D3C7BA;
  --display:"DM Serif Display",Georgia,serif; --body:"Work Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1814; --ink:#F2EAE2; --muted:#BCAFA3; --grid:#352B25; --axis:#6E6056;
  --hi:#E07A5C; --s2:#6FB7BC; --quiet:#54473E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1814; --ink:#F2EAE2; --muted:#BCAFA3; --grid:#352B25; --axis:#6E6056;
  --hi:#E07A5C; --s2:#6FB7BC; --quiet:#54473E; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:32px}
h1{font-family:var(--display);font-weight:400;font-size:36px;margin:0;line-height:1.1}
h2{font-size:18px;margin:0;line-height:1.3;font-weight:600}
.note{color:var(--muted);font-size:14px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;border-top:2px solid var(--ink);padding-top:16px}
.tile{display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .delta{font-size:14px;color:var(--muted)}
.tile .delta strong{color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px}
@media (max-width:760px){.row{grid-template-columns:1fr}}
figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
figure svg{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:var(--muted);font-size:13px;font-family:var(--body)}
svg .num{font-variant-numeric:tabular-nums}
svg .lbl{fill:var(--ink);font-weight:600}
.grid line{stroke:var(--grid)}
.source{color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;width:max-content}
details summary:focus-visible,.pt:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
table{border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{padding:4px 10px;text-align:right;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
td{font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:4px 8px;border-radius:4px}
</style>
</head>
<body>
<main>
<header style="display:flex;flex-direction:column;gap:6px">
  <h1>Corner Cafe, last 4 weeks</h1>
  <p class="note">27 Oct to 23 Nov 2026 · example data</p>
</header>

<section class="tiles" aria-label="Key numbers">
  <div class="tile"><span class="note">Revenue, last 7 days</span><b>$7,315</b><span class="delta"><strong>+3%</strong> vs the week before</span></div>
  <div class="tile"><span class="note">Average ticket</span><b>$11.40</b><span class="delta">target $12.00, last week $10.90</span></div>
  <div class="tile"><span class="note">Best seller</span><b>Flat white</b><span class="delta">412 sold in 4 weeks</span></div>
</section>

<figure data-chart="line" data-series="1" id="f-rev">
  <h2>Sundays peak, and every week beat the last</h2>
  <svg id="c-rev" role="img" aria-label="Line chart of daily revenue over 4 weeks. Every Sunday is the peak, from $1,340 to $1,460. Weekly totals rose from $6,788 to $7,315."></svg>
  <span class="source">Source: till export (example data)</span>
  <details><summary>Show data</summary><div id="t-rev"></div></details>
</figure>

<div class="row">
  <figure data-chart="bar" data-y-min="0" data-series="1" id="f-items">
    <h2>Flat whites outsell everything else</h2>
    <svg id="c-items" role="img" aria-label="Bar chart of items sold. Flat white 412, Croissant 355, Cold brew 298, Banana bread 211, Chai latte 187."></svg>
    <span class="source">Source: till export (example data)</span>
    <details><summary>Show data</summary><div id="t-items"></div></details>
  </figure>
  <figure data-chart="bar" data-y-min="0" data-series="2" id="f-ticket">
    <h2>Average ticket is $0.60 short of target</h2>
    <svg id="c-ticket" role="img" aria-label="Bar chart of average ticket. Last week $10.90, this week $11.40, target $12.00."></svg>
    <span class="source">Source: till export (example data)</span>
    <details><summary>Show data</summary><div id="t-ticket"></div></details>
  </figure>
</div>
</main>
<div class="tip" id="tip" hidden></div>
<script>
const rev = [812,790,845,901,1120,1340,980,805,822,860,915,1180,1395,1010,830,815,872,930,1210,1410,1040,850,841,889,955,1245,1460,1075];
const start = new Date(Date.UTC(2026, 9, 27));
const day = (i) => new Date(start.getTime() + i * 864e5);
const fmt = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const dow = (d) => d.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
const items = [["Flat white",412],["Croissant",355],["Cold brew",298],["Banana bread",211],["Chai latte",187]];
const money = (v) => "$" + v.toLocaleString("en-US");

// ---------- helpers ----------
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function scale(d0, d1, r0, r1) { return (v) => r0 + ((v - d0) / (d1 - d0)) * (r1 - r0); }
function niceTicks(min, max, count = 5) {
  const step0 = (max - min) / count, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
  const ticks = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}
function table(id, head, rows) {
  document.getElementById(id).innerHTML = `<table><thead><tr>${head.map((h) => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
const tip = document.getElementById("tip");
function hover(node, text) {
  node.setAttribute("tabindex", "0"); node.classList.add("pt"); node.setAttribute("aria-label", text);
  const show = (x, y) => { tip.textContent = text; tip.hidden = false; tip.style.left = x + 12 + "px"; tip.style.top = y - 28 + "px"; };
  node.addEventListener("mousemove", (e) => show(e.clientX, e.clientY));
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); show(r.right, r.top); });
  for (const ev of ["mouseleave", "blur"]) node.addEventListener(ev, () => (tip.hidden = true));
}
const width = (svg) => Math.max(300, svg.parentElement.clientWidth);


function drawRev() {
  const svg = document.getElementById("c-rev"); svg.innerHTML = "";
  const W = width(svg), H = W < 500 ? 230 : 280, m = { t: 22, r: 16, b: 28, l: 52 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const x = scale(0, rev.length - 1, m.l, W - m.r), y = scale(0, 1600, H - m.b, m.t);
  const g = el("g", { class: "grid" }, svg);
  for (const t of niceTicks(0, 1600, 4)) { el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }, g); el("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end", class: "num" }, svg).textContent = money(t); }
  for (const i of (W < 500 ? [0, 14, 27] : [0, 7, 14, 21, 27])) el("text", { x: x(i), y: H - 8, "text-anchor": i === 0 ? "start" : i === 27 ? "end" : "middle", class: "num" }, svg).textContent = fmt(day(i));
  el("polyline", { points: rev.map((v, i) => `${x(i)},${y(v)}`).join(" "), fill: "none", stroke: css("--quiet"), "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  rev.forEach((v, i) => {
    const sun = day(i).getUTCDay() === 0;
    hover(el("circle", { cx: x(i), cy: y(v), r: sun ? 5 : 3, fill: sun ? css("--hi") : css("--quiet") }, svg), `${dow(day(i))} ${fmt(day(i))}: ${money(v)}`);
    if (sun && (W >= 500 || i === 26)) el("text", { x: x(i), y: y(v) - 10, "text-anchor": "middle", class: "lbl num" }, svg).textContent = money(v);
  });
  table("t-rev", ["Day", "Revenue"], rev.map((v, i) => [`${dow(day(i))} ${fmt(day(i))}`, money(v)]));
}
function bars(id, rows, fmtv, hiIndex, targetLine) {
  const svg = document.getElementById(id); svg.innerHTML = "";
  const W = width(svg), row = 34, m = { t: 4, r: 56, b: targetLine ? 24 : 4, l: 108 }, H = m.t + m.b + row * rows.length;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const max = Math.max(...rows.map((r) => r[1]), targetLine || 0), x = scale(0, max, m.l, W - m.r);
  rows.forEach(([name, v], i) => {
    const yy = m.t + i * row, hi = i === hiIndex;
    el("text", { x: m.l - 10, y: yy + row / 2 + 4, "text-anchor": "end", class: hi ? "lbl" : "" }, svg).textContent = name;
    hover(el("rect", { x: m.l, y: yy + 6, width: x(v) - m.l, height: row - 12, fill: hi ? css("--hi") : css("--quiet") }, svg), `${name}: ${fmtv(v)}`);
    // Value at the bar end; inside the bar when a target line sits just past it.
    const inside = targetLine && x(targetLine) - x(v) < 70;
    const t = el("text", { x: inside ? x(v) - 8 : x(v) + 6, y: yy + row / 2 + 4, "text-anchor": inside ? "end" : "start", class: "num" + (hi ? " lbl" : "") }, svg);
    t.textContent = fmtv(v);
    if (inside) t.style.fill = hi ? css("--bg") : css("--ink");
  });
  el("line", { x1: m.l, x2: m.l, y1: 0, y2: H - m.b, stroke: css("--axis") }, svg);
  if (targetLine) {
    el("line", { x1: x(targetLine), x2: x(targetLine), y1: 0, y2: H - m.b + 4, stroke: css("--ink"), "stroke-dasharray": "4 3" }, svg);
    el("text", { x: x(targetLine), y: H - 6, "text-anchor": "middle", class: "lbl" }, svg).textContent = "Target " + fmtv(targetLine);
  }
}
function drawAll() {
  drawRev();
  bars("c-items", items, (v) => v, 0);
  table("t-items", ["Item", "Sold"], items);
  const t = [["Last week", 10.9], ["This week", 11.4], ["Target", 12]];
  bars("c-ticket", t.slice(0, 2), (v) => "$" + v.toFixed(2), 1, 12);
  table("t-ticket", ["", "Average ticket"], t.map(([a, v]) => [a, "$" + v.toFixed(2)]));
}
drawAll();
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(drawAll, 120); }).observe(document.querySelector("main"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll);
</script>
</body>
</html>
